<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign Up</title>

  <!-- Optional: Bootstrap CSS (for nicer visuals; not required for logic) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
  <!-- IST 256: jQuery CDN for AJAX + DOM helpers -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- IST 256: AngularJS CDN to satisfy assignment requirement -->
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>

</head>
<body>

<!-- Simple shared navbar so every page has navigation links (assignment requirement). -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-3">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">Storefront</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"
      aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="shopper-management.html">Shopper</a></li>
        <li class="nav-item"><a class="nav-link" href="product.html">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="shoppingcart.html">Cart</a></li>
        <li class="nav-item"><a class="nav-link" href="shipping-selection.html">Shipping</a></li>
        <li class="nav-item"><a class="nav-link" href="billing-details.html">Billing</a></li>
        <li class="nav-item"><a class="nav-link" href="handle-returns.html">Returns</a></li>
      </ul>
    </div>
  </div>
</nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <h1 class="mb-4 text-center">Create your account</h1>

        <!-- No 'required' attributes; JS handles validation -->
        <form id="signupForm" action="#" method="post" novalidate>
          <!-- Username -->
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input id="username" name="username" type="text" class="form-control" autocomplete="username" />
            <div class="invalid-feedback">Please enter a username.</div>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input id="email" name="email" type="text" class="form-control" placeholder="joe@test.com" autocomplete="email" />
            <div class="invalid-feedback">Please enter a valid email (e.g., joe@test.com).</div>
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input id="password" name="password" type="password" class="form-control" autocomplete="new-password" />
            <div class="invalid-feedback">Please enter a password.</div>
          </div>

          <!-- Confirm Password -->
          <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" class="form-control" autocomplete="new-password" />
            <div class="invalid-feedback">Passwords must match.</div>
          </div>

          <button type="submit" class="btn btn-primary w-100">Create Account</button>
        </form>

        <div id="formSuccess" class="alert alert-success mt-3 d-none" role="alert">
          Account created Successfully!
        </div>
      </div>
    </div>
  </main>

  <!-- Place scripts at the END so the DOM exists when JS runs -->
  <script src="validation.js"></script>
</body>
</html>
